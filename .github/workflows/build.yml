name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [patches/**, Dockerfile, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build
  cancel-in-progress: false

env:
  QBT_TAG: release-5.2.3
  IMAGE: ghcr.io/${{ github.repository_owner }}/qbittorrent

jobs:
  deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch static build script
        run: curl -sLo qbt-nox-static.bash https://raw.githubusercontent.com/userdocs/qbittorrent-nox-static/master/qbt-nox-static.bash

      - name: Prepare build env
        run: |
          printf '%s\n' \
            "qbt_build_dir=qbt-build" \
            "qbt_build_tool=cmake" \
            "qbt_qt_version=6" \
            "qbt_libtorrent_version=1.2" \
            "qbt_workflow_files=yes" \
            "qbt_qbittorrent_tag=${QBT_TAG}" \
            "qbt_patches_url=${{ github.repository }}" \
            > env.custom

      - name: Compute cache key
        id: key
        run: echo "key=deps-v1-${{ hashFiles('qbt-nox-static.bash', 'env.custom') }}" >> "$GITHUB_OUTPUT"

      - name: Pin build inputs for image job
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs
          path: |
            qbt-nox-static.bash
            env.custom

      - name: Probe dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: qbt-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Start alpine build container
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          docker run -d --name qbt --env-file env.custom -w /root -v "$PWD:/root" alpine:latest sleep infinity
          docker exec qbt apk add --no-cache autoconf automake bash bash-completion build-base cmake coreutils curl git libtool linux-headers ninja-build perl pkgconf python3 python3-dev re2c tar ttf-freefont util-linux xz zip

      - name: Bootstrap deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash bootstrap_deps

      - name: Bootstrap
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash -bs-a

      - name: Build zlib
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash zlib

      - name: Build iconv
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash iconv

      - name: Build openssl
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash openssl

      - name: Build boost
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash boost

      - name: Build libtorrent
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash libtorrent

      - name: Build qtbase
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash qtbase

      - name: Build qttools
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: docker exec -w /root qbt bash qbt-nox-static.bash qttools

      - name: Fix cache permissions
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" qbt-build

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: qbt-build
          key: ${{ steps.key.outputs.key }}

  image:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned build inputs
        uses: actions/download-artifact@v4
        with:
          name: build-inputs

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: qbt-build
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Start alpine build container
        run: |
          docker run -d --name qbt --env-file env.custom -w /root -v "$PWD:/root" alpine:latest sleep infinity
          docker exec qbt apk add --no-cache autoconf automake bash bash-completion build-base cmake coreutils curl git libtool linux-headers ninja-build perl pkgconf python3 python3-dev re2c tar ttf-freefont util-linux xz zip

      - name: Bootstrap deps
        run: docker exec -w /root qbt bash qbt-nox-static.bash bootstrap_deps

      - name: Bootstrap
        run: docker exec -w /root qbt bash qbt-nox-static.bash -bs-a

      - name: Stage local patches
        run: |
          mkdir -p qbt-build/patches
          cp -r patches/* qbt-build/patches/

      - name: Build qbittorrent
        run: docker exec -w /root qbt bash qbt-nox-static.bash qbittorrent

      - name: Collect binary
        run: |
          sudo cp qbt-build/completed/qbittorrent-nox qbittorrent-nox
          file qbittorrent-nox

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE}:${QBT_TAG}-cache" .
          docker push "${IMAGE}:${QBT_TAG}-cache"
